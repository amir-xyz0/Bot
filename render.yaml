services:
  - type: web
    name: life-assistant-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
    buildFilter:
      pythonVersion: 3.11.8
